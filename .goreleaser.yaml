version: 2

project_name: svgtuber

before:
  hooks:
    - go mod tidy

builds:
  - id: svgtuber
    main: ./cmd/svgtuber
    binary: svgtuber
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    builds:
      - svgtuber
    name_template: "SVGTuber-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: testdata/test_avatar.svg
        dst: avatar.svg
      - src: testdata/accessories/*
        dst: accessories
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/RIGGING_GUIDE.md
      - docs/ACCESSORIES_GUIDE.md
      - docs/MCP_GUIDE.md
      - docs/OBS_QUICKSTART.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: mrpoundsign
    name: SVGTuber
  draft: false
  prerelease: auto
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
