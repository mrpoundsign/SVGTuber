version: 2

project_name: svgtuber

before:
  hooks:
    - go mod tidy

builds:
  - id: svgtuber-windows
    main: ./cmd/svgtuber
    binary: svgtuber
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -H windowsgui -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -extldflags "-static-libgcc"

  - id: svgtuber-linux
    main: ./cmd/svgtuber
    binary: svgtuber
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    builds:
      - svgtuber-windows
      - svgtuber-linux
    name_template: "SVGTuber-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: testdata/test_avatar.svg
        dst: avatar.svg
      - src: testdata/cow_avatar.svg
        dst: cow_avatar.svg
      - src: testdata/robot_avatar.svg
        dst: robot_avatar.svg
      - src: testdata/triangle_robot_avatar.svg
        dst: triangle_robot_avatar.svg
      - src: testdata/accessories/*
        dst: accessories
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/RIGGING_GUIDE.md
      - docs/ACCESSORIES_GUIDE.md
      - docs/MCP_GUIDE.md
      - docs/OBS_QUICKSTART.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: mrpoundsign
    name: SVGTuber
  draft: false
  prerelease: auto
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
