<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVGTuber - Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #avatar-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #avatar-container svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
    }
    #status-indicator {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-family: monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #aaa;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    body.show-status #status-indicator {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="avatar-container"></div>
  <div id="status-indicator">Connecting...</div>
  <script src="/overlay/overlay.js?v=0.0.3"></script>
</body>
</html>
