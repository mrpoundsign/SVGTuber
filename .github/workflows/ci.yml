name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Bundle Frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Verify Linux Static Build
        run: CGO_ENABLED=0 go build -v ./cmd/svgtuber

      - name: Verify Windows Static Build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -v ./cmd/svgtuber

      - name: Verify macOS Static Build
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -v ./cmd/svgtuber
