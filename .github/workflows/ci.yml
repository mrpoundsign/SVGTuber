name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Bundle Frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & MinGW Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev

      - name: Run Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Verify Linux Desktop Build (CGO_ENABLED=1)
        run: |
          chmod +x ./build.sh
          ./build.sh build

      - name: Verify Windows Desktop & Setup Installer Build (CGO_ENABLED=1)
        run: |
          chmod +x ./build.sh
          ./build.sh installer
