name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'testdata/*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage Starter Avatars for Showcase
        run: |
          mkdir -p docs/avatars
          cp -f testdata/test_avatar.svg docs/avatars/avatar.svg
          cp -f testdata/cow_avatar.svg docs/avatars/cow_avatar.svg
          cp -f testdata/robot_avatar.svg docs/avatars/robot_avatar.svg
          cp -f testdata/triangle_robot_avatar.svg docs/avatars/triangle_robot_avatar.svg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
